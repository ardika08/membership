<!doctype html>
<html lang="id" suppressHydrationWarning>
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="492x492" href="/favsite.png" />
    <link rel="apple-touch-icon" sizes="492x492" href="/favsite.png" />
    <meta
          name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
        />
    <meta
      name="description"
      content="Member area Grafista Digital untuk membeli dan mengunduh produk digital: template Canva, Elementor, ebook, prompt AI, dan source code."
    />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141821" media="(prefers-color-scheme: dark)" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <title>Grafista Digital — Member Area</title>

    <script>
      // Terapkan tema sebelum paint pertama untuk mencegah flash of wrong theme.
      ;(function () {
        try {
          var stored = localStorage.getItem('membership.theme')
          var theme = stored ? JSON.parse(stored).state.theme : 'system'
          var dark =
            theme === 'dark' ||
            (theme === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', dark)
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
